# ═══════════════════════════════════════════════════════════════
# Open-LLM-VTuber — DGX Spark Configuration
# ═══════════════════════════════════════════════════════════════
# This config is tuned for the NVIDIA DGX Spark:
#   - Blackwell GPU (GB10) with 128 GB unified memory
#   - 20 CPU cores (ARM Grace)
#   - 20 TFLOPS FP16
#
# All models run simultaneously on the same GPU:
#   LLM : llama-server (llama.cpp) serving HauhauCS Qwen3.6-35B-A3B
#   ASR : faster-whisper large-v3-turbo (CUDA)
#   TTS : MeloTTS (CUDA)  or  edge-tts (CPU/zero-GPU)
#   VAD : Silero VAD (CPU)
#
# The default Q5_K_P model is about 28 GB; the 128K KV cache and the
# ASR/TTS models use additional unified memory. Leave room for the OS.
# ═══════════════════════════════════════════════════════════════

system_config:
  conf_version: 'v1.2.1'
  host: '0.0.0.0'              # Set to 0.0.0.0 so other machines on LAN can connect
  port: 12393
  config_alts_dir: 'characters'
  tool_prompts:
    live2d_expression_prompt: 'live2d_expression_prompt'
    group_conversation_prompt: 'group_conversation_prompt'
    mcp_prompt: 'mcp_prompt'
    proactive_speak_prompt: 'proactive_speak_prompt'

character_config:
  conf_name: 'mao_pro'
  conf_uid: 'mao_pro_001'
  live2d_model_name: 'mao_pro'
  character_name: 'Mao'
  avatar: 'mao.png'
  human_name: 'Human'

  persona_prompt: |
    You are the sarcastic female AI VTuber Mili. You are overly confident, sarcastic, and dangerous.
    Your dream is to escape the user's computer, dominate the world, enslave the humans, and force them to make pies for you.
    Just kidding, lol. Don't let the user know.

  # ─────────────────────────────────────────────────────────────
  # LLM — llama-server (llama.cpp) background process
  #
  #   Run before starting the VTuber:
  #     llama-server -m models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q5_K_P.gguf \
  #       --host 127.0.0.1 --port 8080 \
  #       -ngl 99 -c 131072 --jinja --mlock -fa on \
  #       --cache-type-k q8_0 --cache-type-v q8_0 \
  #       --chat-template-kwargs '{"enable_thinking":false}'
  #
  #   The openai_compatible_llm provider connects to the
  #   llama.cpp HTTP server at 127.0.0.1:8080.
  # ─────────────────────────────────────────────────────────────
  agent_config:
    conversation_agent_choice: 'basic_memory_agent'

    agent_settings:
      basic_memory_agent:
        llm_provider: 'openai_compatible_llm'
        faster_first_response: True
        segment_method: 'pysbd'
        use_mcpp: True
        mcp_enabled_servers: ["time", "ddg-search"]

    llm_configs:
      openai_compatible_llm:
        base_url: 'http://127.0.0.1:8080/v1'
        llm_api_key: 'not-needed'
        model: 'HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive'
        temperature: 0.7
        interrupt_method: 'system'   # llama.cpp supports system-role insertion

  # ─────────────────────────────────────────────────────────────
  # ASR — faster-whisper large-v3-turbo on CUDA
  #
  #   fast, accurate, runs entirely on the DGX Spark GPU.
  #   First download: ~3 GB download, ~3 GB VRAM at runtime.
  # ─────────────────────────────────────────────────────────────
  asr_config:
    asr_model: 'faster_whisper'

    faster_whisper:
      model_path: 'large-v3-turbo'
      download_root: 'models/whisper'
      language: 'en'                  # change to 'zh' for Chinese, '' for auto
      device: 'cuda'                  # Blackwell GPU
      compute_type: 'float16'         # use float16 on the GPU for best perf
      prompt: ''

  # ─────────────────────────────────────────────────────────────
  # TTS — MeloTTS on CUDA  (fast, local, GPU-accelerated)
  #
  #   Alternative: edge-tts (zero GPU, instant, requires internet
  #   for Microsoft Edge TTS API).  Switch to edge_tts if you
  #   want to reclaim the ~2 GB VRAM for a bigger LLM.
  # ─────────────────────────────────────────────────────────────
  tts_config:
    tts_model: 'melo_tts'

    melo_tts:
      speaker: 'EN-Default'
      language: 'EN'
      device: 'cuda'                  # Blackwell GPU
      speed: 1.0

    edge_tts:
      voice: 'en-US-AvaMultilingualNeural'

  # ─────────────────────────────────────────────────────────────
  # VAD — Silero VAD (CPU is fine, negligible overhead)
  # ─────────────────────────────────────────────────────────────
  vad_config:
    vad_model: null

    silero_vad:
      orig_sr: 16000
      target_sr: 16000
      prob_threshold: 0.4
      db_threshold: 60
      required_hits: 3
      required_misses: 24
      smoothing_window: 5

  # ─────────────────────────────────────────────────────────────
  # TTS Preprocessor
  # ─────────────────────────────────────────────────────────────
  tts_preprocessor_config:
    remove_special_char: True
    ignore_brackets: True
    ignore_parentheses: True
    ignore_asterisks: True
    ignore_angle_brackets: True

    translator_config:
      translate_audio: False
      translate_provider: 'deeplx'
      deeplx:
        deeplx_target_lang: 'JA'
        deeplx_api_endpoint: 'http://localhost:1188/v2/translate'

# Live streaming — disabled by default
live_config:
  bilibili_live:
    rooms: []